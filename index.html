<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Night Café LoFi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=Nunito:wght@300;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <section class="hero" aria-labelledby="hero-title">
        <div class="hero__overlay">
          <p class="hero__badge">Night Café × LoFi</p>
          <h1 id="hero-title">手書きノートに描く夜カフェサウンド</h1>
          <p class="hero__subtitle">
            雨音とラテの香りをまとった LoFi ミックス。スマホ一つで没入する chill time。
          </p>
          <button id="playButton" class="play-button" type="button" aria-pressed="false">
            ▶︎ Play
          </button>
        </div>
      </section>

      <section class="gallery" aria-labelledby="gallery-title">
        <div class="section-heading">
          <p class="section-heading__label">Gallery</p>
          <h2 id="gallery-title">夜カフェのスナップ</h2>
        </div>
        <div class="slider" role="region" aria-label="Night café gallery">
          <button class="slider__control" data-direction="prev" aria-label="前の写真">
            ‹
          </button>
          <div class="slider__track" tabindex="0">
            <article class="slider__item">
              <img src="img/cafe1.jpg" alt="木目テーブルと夜景のあるカフェ" />
            </article>
            <article class="slider__item">
              <img src="img/cafe2.jpg" alt="ネオンライトに照らされたカウンター" />
            </article>
            <article class="slider__item">
              <img src="img/cafe3.jpg" alt="スケッチブックとコーヒー" />
            </article>
          </div>
          <button class="slider__control" data-direction="next" aria-label="次の写真">
            ›
          </button>
        </div>
      </section>

      <section class="sns" aria-labelledby="sns-title">
        <div class="section-heading">
          <p class="section-heading__label">SNS</p>
          <h2 id="sns-title">つながるカフェ時間</h2>
        </div>
        <div class="sns__buttons">
          <a class="sns__button" href="https://www.tiktok.com" target="_blank" rel="noopener"
            >TikTok</a
          >
          <a class="sns__button" href="https://www.youtube.com" target="_blank" rel="noopener"
            >YouTube</a
          >
          <a class="sns__button" href="https://www.instagram.com" target="_blank" rel="noopener"
            >Instagram</a
          >
        </div>
      </section>
    </main>

    <footer class="footer">
      <p>© 2024 Night Café LoFi Mix</p>
      <small>スマホで楽しむチルなナイトセッション</small>
    </footer>

    <audio id="lofiAudio" src="your-lofi.mp3" preload="auto"></audio>
    <script src="script.js"></script>
  </body>
</html>
